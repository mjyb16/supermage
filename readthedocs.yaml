# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub

build:
  # ubuntu-20.04 was removed by Read the Docs on 2026-06-01; builds pinned to
  # it fail at config validation.
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  apt_packages:
    - pandoc # Specify pandoc to be installed via apt-get
    - graphviz # Specify graphviz to be installed via apt-get
  jobs:
    post_checkout:
      # RTD clones shallow (depth 50) WITHOUT tags; setuptools_scm needs the
      # tag history to derive the package version during `pip install .`.
      - git fetch --unshallow || true
      - git fetch --tags || true
    pre_install:
      # Install CPU-only torch first: the default PyPI wheel drags in
      # multi-gigabyte NVIDIA CUDA libraries that exceed RTD's disk/time
      # budget. The later `-r requirements.txt` sees torch already satisfied.
      - pip install torch --index-url https://download.pytorch.org/whl/cpu
    pre_build:
      # Generate the Sphinx configuration for this Jupyter Book so it builds.
      - "jupyter-book config sphinx docs/source/"
      # Create font cache ahead of jupyter book
      - 'python -c "import matplotlib.pyplot as plt"'
      # API documentation comes from the static autodoc pages in
      # docs/source/api/ (sphinx-apidoc is no longer used; it generated
      # orphan pages outside the book TOC).

python:
  install:
    - requirements: docs/requirements.txt # Path to your requirements.txt file
    - requirements: requirements.txt # Path to your requirements.txt file
    - method: pip
      path: . # Install the package itself
